<style>
        .tabular-nums { font-variant-numeric: tabular-nums; }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>

<body class="bg-background text-on-background antialiased min-h-screen flex flex-col selection:bg-primary-container selection:text-on-primary-container">
<!-- Top App Bar (Transactional intent - simplified) -->
<header class="sticky top-0 w-full z-40 bg-background px-margin-mobile py-4 flex items-center justify-between border-b border-surface-container-highest">
<button class="w-11 h-11 flex items-center justify-center rounded-full hover:bg-surface-container-highest transition-colors text-on-surface-variant active:scale-95">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">close</span>
</button>
<h1 class="font-headline-md text-headline-md text-primary tracking-tight">Review Expense</h1>
<div class="w-11 h-11"></div> <!-- Spacer for centering -->
</header>
<main class="flex-grow px-margin-mobile pt-6 pb-[calc(100px+var(--safe-area-bottom))]">
<!-- Receipt Thumbnail Container -->
<div class="flex justify-center mb-8">
<div class="relative w-40 h-56 rounded-xl overflow-hidden bg-surface-container-low">
<img class="w-full h-full object-cover" data-alt="A macro shot of a crisp white thermal paper receipt resting on a textured wooden desk. The receipt shows a faded black ink printing of an AWS transaction for $49.99. The lighting is soft and diffused, coming from a nearby window, creating a warm editorial feel typical of a financial app. The image conveys precision and a hint of modern enterprise utility." src="https://lh3.googleusercontent.com/aida-public/AB6AXuDLWb_xR2zKMIUwW5rroSkatODBiXlZiQ7YTxUTRxBVYCunVMqZ7510QUoqB8TxHBzeuIjlTeMARe_Tq-oV0U0m31dqdy3l8vFOqWXtKb6HEKMSOXf_Dzm453ADWSxZH5PX-7a7_ZsTLzj__iEOYN7rbdFX8RD5xy9fBZtge3G4WG_r7_N4Dfs4EHnGRhbLOQ8IgrfNUQWTMEq9Fdl0YPU4yPOpgK4O5FZ5ZxbdEmzEx_7gvy_eM01x"/>
<!-- Scan Overlay effect -->
<div class="absolute inset-0 bg-gradient-to-t from-sky-blue/30 to-transparent flex items-end p-3">
<div class="flex items-center gap-1.5 text-on-primary-container bg-sky-blue/90 px-2.5 py-1 rounded-full text-xs font-semibold">
<span class="material-symbols-outlined text-[14px]" style="font-variation-settings: 'FILL' 1;">document_scanner</span>
                        Extracted
                    </div>
</div>
</div>
</div>
<!-- Expense Amount -->
<div class="text-center mb-stack-gap">
<p class="font-metadata text-metadata text-on-surface-variant mb-1 uppercase tracking-widest">Total Amount</p>
<div class="font-display-currency text-display-currency text-primary tabular-nums">$49.99</div>
</div>
<!-- Form Fields (Auto-filled) -->
<div class="space-y-stack-gap">
<!-- Vendor -->
<div class="bg-surface-container-low rounded-xl p-4 transition-all">
<label class="block font-metadata text-metadata text-on-surface-variant mb-1.5">Vendor</label>
<div class="flex items-center gap-3">
<div class="w-8 h-8 rounded-full bg-lavender flex items-center justify-center shrink-0">
<span class="material-symbols-outlined text-on-surface text-[18px]">cloud</span>
</div>
<input class="w-full bg-transparent border-none p-0 font-body-lg text-body-lg text-on-surface focus:ring-0" readonly="" type="text" value="AWS"/>
</div>
</div>
<!-- Category -->
<div class="bg-surface-container-low rounded-xl p-4">
<label class="block font-metadata text-metadata text-on-surface-variant mb-1.5">Category</label>
<div class="flex items-center justify-between">
<div class="flex items-center gap-3">
<div class="w-8 h-8 rounded-full bg-peach flex items-center justify-center shrink-0">
<span class="material-symbols-outlined text-on-surface text-[18px]">devices</span>
</div>
<span class="font-body-lg text-body-lg text-on-surface">Software Subscription</span>
</div>
<span class="material-symbols-outlined text-on-surface-variant text-[20px]">chevron_right</span>
</div>
</div>
<!-- Date -->
<div class="bg-surface-container-low rounded-xl p-4">
<label class="block font-metadata text-metadata text-on-surface-variant mb-1.5">Date</label>
<div class="flex items-center gap-3">
<div class="w-8 h-8 rounded-full bg-sky-blue flex items-center justify-center shrink-0">
<span class="material-symbols-outlined text-on-surface text-[18px]">calendar_today</span>
</div>
<input class="w-full bg-transparent border-none p-0 font-body-lg text-body-lg text-on-surface focus:ring-0 tabular-nums" readonly="" type="text" value="Oct 24, 2023"/>
</div>
</div>
<!-- Policy Check -->
<div class="mt-8 rounded-xl bg-mint/50 p-4 relative overflow-hidden">
<div class="relative z-10 flex gap-4">
<div class="w-10 h-10 rounded-full bg-mint flex items-center justify-center shrink-0">
<span class="material-symbols-outlined text-on-primary-container" style="font-variation-settings: 'FILL' 1;">check_circle</span>
</div>
<div>
<h3 class="font-label-md text-label-md text-on-primary-container mb-0.5">This one's all set ✅</h3>
<p class="font-body-md text-body-md text-on-primary-container/80">Within monthly software budget</p>
</div>
</div>
</div>
</div>
</main>
<!-- Fixed Bottom Action Area -->
<div class="fixed bottom-0 left-0 w-full bg-surface px-margin-mobile pt-4 pb-[max(20px,env(safe-area-inset-bottom))] z-50 border-t border-surface-container-highest">
<button class="w-full bg-primary text-on-primary font-label-md text-label-md py-4 rounded-full active:scale-[0.98] transition-transform flex items-center justify-center gap-2">
            Submit
            <span class="material-symbols-outlined text-[18px]">send</span>
</button>
</div>
</body></html>
