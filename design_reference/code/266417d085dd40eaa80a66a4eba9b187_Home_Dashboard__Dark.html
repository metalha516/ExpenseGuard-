<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>

                        "inverse-surface": "#32302c",
                        "surface-tint": "#206a57",

                    "borderRadius": {
                        "DEFAULT": "0.25rem",

                        "headline-lg": ["Inter"]

                    "fontSize": {
                        "body-lg": ["17px", { "lineHeight": "24px", "fontWeight": "400" }],

                        "headline-lg": ["28px", { "lineHeight": "34px", "letterSpacing": "-0.01em", "fontWeight": "600" }]

                }
            }
        }

<style>
        /* Base Dark Mode Override for Custom Request */
        .dark body {
            background-color: #14171F; /* Specific deep charcoal-navy requested */
            color: #ffffff;
        }
        /* Custom styles to bridge design system dark mode with request */
        .dark .bg-surface-dark {
            background-color: #1E2330;
        }
        .dark .border-outline-dark {
            border-color: #2A3142;
        }
        .text-teal-accent {
            color: #8ed4bd; /* primary-fixed-dim mapping for glowing accent */
        }
        .bg-teal-accent-dim {
            background-color: rgba(14, 94, 76, 0.2); /* primary-container with opacity */
        }
        .shadow-glow-teal {
            box-shadow: 0 0 10px rgba(142, 212, 189, 0.3);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="antialiased min-h-screen flex flex-col relative pb-safe-area-bottom dark">
<!-- TopAppBar -->
<header class="sticky top-0 w-full z-40 bg-transparent flex justify-between items-center px-margin-mobile py-4 transition-colors">
<div class="flex items-center gap-3">
<div class="w-10 h-10 rounded-full overflow-hidden border border-outline-dark shadow-[0px_4px_12px_rgba(0,0,0,0.2)]">
<img alt="User Profile" class="w-full h-full object-cover" data-alt="A close up portrait of a professional individual in a corporate setting, warm lighting, high quality, dark mode aesthetic." src="https://lh3.googleusercontent.com/aida-public/AB6AXuDF5D2PWtCVjcJQgc43lT8qH6hhlXBRy2iAMgOB4XsHPZuwRfNKywEfoKlefcoycjlZ-ENRlHWWgoEoRvPHs_4mOwV8jFk3RH48iNzOIxn_uwtuwfbWNhJ-rIV9w_lGNYNCs50FQiNvPuRLDZvmBHgLDIbKz7APbQbu8dzrlj87eHQLaY9bWxSKi-AlZtXH-BLUcRGtnCdo6hDZtBkIvwNuXtX5KJWhNZx8sUSDkODkB4SEbcBPBiPK"/>
</div>
<div>
<h1 class="font-headline-md text-headline-md font-bold text-white tracking-tight">ExpenseGuard</h1>
<p class="font-metadata text-metadata text-gray-400">Good Morning, Alex</p>
</div>
</div>
<button aria-label="Notifications" class="w-10 h-10 rounded-full flex items-center justify-center text-gray-300 hover:bg-[#1E2330] transition-colors">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">notifications</span>
</button>
</header>
<!-- Main Content Canvas -->
<main class="flex-grow px-margin-mobile flex flex-col gap-stack-gap z-10 pb-24">
<!-- Large Spend Summary Card with Subtle Gradient -->
<section class="bg-gradient-to-br from-[#1A2522] to-[#14171F] border border-outline-dark rounded-[24px] p-6 shadow-[0px_8px_24px_rgba(0,0,0,0.4)] relative overflow-hidden">
<!-- Decorative background element -->
<div class="absolute top-0 right-0 w-32 h-32 bg-primary-container opacity-20 rounded-full blur-[40px] -translate-y-1/2 translate-x-1/2"></div>
<p class="font-label-md text-label-md text-gray-400 mb-1">Total Spend this Month</p>
<h2 class="font-display-currency text-display-currency text-white mb-6">$4,250.00</h2>
<div class="flex justify-between items-end">
<div class="flex gap-4">
<div>
<p class="font-metadata text-metadata text-gray-400">Approved</p>
<p class="font-body-md text-body-md font-semibold text-teal-accent">$3,100</p>
</div>
<div>
<p class="font-metadata text-metadata text-gray-400">Pending</p>
<p class="font-body-md text-body-md font-semibold text-secondary-fixed-dim">$1,150</p>
</div>
</div>
<button class="bg-primary-container text-white px-4 py-2 rounded-full font-label-md text-label-md flex items-center gap-1 shadow-glow-teal hover:scale-95 transition-transform duration-150">
<span class="material-symbols-outlined text-[18px]">add</span>
                    Expense
                </button>
</div>
</section>
<!-- Quick Actions Bento -->
<section class="grid grid-cols-2 gap-3 mt-2">
<button class="bg-surface-dark border border-outline-dark rounded-[16px] p-4 flex flex-col gap-3 items-start hover:bg-[#252A3A] transition-colors text-left group">
<div class="w-10 h-10 rounded-full bg-teal-accent-dim text-teal-accent flex items-center justify-center group-hover:scale-110 transition-transform">
<span class="material-symbols-outlined">receipt_long</span>
</div>
<div>
<h3 class="font-label-md text-label-md text-white">Scan Receipt</h3>
<p class="font-metadata text-metadata text-gray-400">AI auto-fill</p>
</div>
</button>
<button class="bg-surface-dark border border-outline-dark rounded-[16px] p-4 flex flex-col gap-3 items-start hover:bg-[#252A3A] transition-colors text-left group">
<div class="w-10 h-10 rounded-full bg-[#322C1A] text-secondary-fixed-dim flex items-center justify-center group-hover:scale-110 transition-transform">
<span class="material-symbols-outlined">flight_takeoff</span>
</div>
<div>
<h3 class="font-label-md text-label-md text-white">New Trip</h3>
<p class="font-metadata text-metadata text-gray-400">Plan travel</p>
</div>
</button>
</section>
<!-- Transaction List -->
<section class="mt-4 flex flex-col gap-3">
<div class="flex justify-between items-center mb-2">
<h3 class="font-headline-md text-[18px] font-semibold text-white">Recent Transactions</h3>
<button class="font-label-md text-label-md text-teal-accent hover:underline">View All</button>
</div>
<!-- Transaction Item 1 -->
<div class="bg-surface-dark border border-outline-dark rounded-[16px] p-4 flex items-center justify-between shadow-[0px_4px_12px_rgba(0,0,0,0.2)] active:scale-[0.98] transition-transform">
<div class="flex items-center gap-3">
<div class="w-12 h-12 rounded-xl bg-white flex items-center justify-center p-2">
<img alt="Delta Airlines" class="w-full h-full object-contain" data-alt="A clean, minimalist airline logo icon, simple geometric shapes, isolated on a white background, corporate design style." src="https://lh3.googleusercontent.com/aida-public/AB6AXuBnWG0-2CvtvQz4tXWird3aTXsW-7R3TuYPXn8hCifzFl_9Ca6uQItyzeD-e9nlscZ2qzdtQKlijhg5lmOJOLPGsXSt3Ev9GUA_Xl1wPqkwoRvKok7Hgq9MLylxNnHORq3nLR1vj1-jl57GKCp9jGL4NUutmfvATcaHW0bJeIC6KV0_t85yrtFlzrkbiAvMVhvAaGVyfpfsU2ijfn4qSNNlUM1-m4D7mZuZpMw6tvBcYggoa67Gxa2o"/>
</div>
<div>
<h4 class="font-body-md text-body-md font-semibold text-white">Delta Airlines</h4>
<p class="font-metadata text-metadata text-gray-400">Oct 24 • Travel</p>
</div>
</div>
<div class="text-right flex flex-col items-end">
<p class="font-body-md text-body-md font-bold text-white tabular-nums">$645.00</p>
<span class="mt-1 px-2 py-0.5 rounded-full bg-teal-accent-dim text-teal-accent font-metadata text-[10px] uppercase font-semibold border border-[rgba(142,212,189,0.3)] shadow-glow-teal">Approved</span>
</div>
</div>
<!-- Transaction Item 2 -->
<div class="bg-surface-dark border border-outline-dark rounded-[16px] p-4 flex items-center justify-between shadow-[0px_4px_12px_rgba(0,0,0,0.2)] active:scale-[0.98] transition-transform">
<div class="flex items-center gap-3">
<div class="w-12 h-12 rounded-xl bg-white flex items-center justify-center p-2">
<img alt="Starbucks" class="w-full h-full object-contain" data-alt="A modern, abstract coffee shop logo, minimal line art, isolated on a white background, clean corporate design style." src="https://lh3.googleusercontent.com/aida-public/AB6AXuABrN4KK9eotTd_gr_w_pUvjl0Vbq6uqEnyn0YU8dS9_EvElt_vdy_rpWA0R1uIA2nJ5RTXj-52RNL565f4fJZFovptdGgOY3iCSeQk3x_xKenE8VUnQy2Qd0yO3vbHdb2p6htxLVSLYhC9c32jsXkzzbKKgm5omMkNlOKciLGjunU7rVMoApNUQ2v1pA0BaQz-y13AkpIX0bxDLCLkIbSOrSJjzze3s6tFTR5azO9rURr4hq3kqVCg"/>
</div>
<div>
<h4 class="font-body-md text-body-md font-semibold text-white">Starbucks</h4>
<p class="font-metadata text-metadata text-gray-400">Oct 23 • Meals</p>
</div>
</div>
<div class="text-right flex flex-col items-end">
<p class="font-body-md text-body-md font-bold text-white tabular-nums">$14.50</p>
<span class="mt-1 px-2 py-0.5 rounded-full bg-[#322C1A] text-secondary-fixed-dim font-metadata text-[10px] uppercase font-semibold border border-[rgba(236,194,70,0.3)]">Pending</span>
</div>
</div>
<!-- Transaction Item 3 -->
<div class="bg-surface-dark border border-outline-dark rounded-[16px] p-4 flex items-center justify-between shadow-[0px_4px_12px_rgba(0,0,0,0.2)] active:scale-[0.98] transition-transform">
<div class="flex items-center gap-3">
<div class="w-12 h-12 rounded-xl bg-[#252A3A] flex items-center justify-center text-gray-300">
<span class="material-symbols-outlined">local_taxi</span>
</div>
<div>
<h4 class="font-body-md text-body-md font-semibold text-white">Uber</h4>
<p class="font-metadata text-metadata text-gray-400">Oct 21 • Transport</p>
</div>
</div>
<div class="text-right flex flex-col items-end">
<p class="font-body-md text-body-md font-bold text-white tabular-nums">$42.80</p>
<span class="mt-1 px-2 py-0.5 rounded-full bg-teal-accent-dim text-teal-accent font-metadata text-[10px] uppercase font-semibold border border-[rgba(142,212,189,0.3)] shadow-glow-teal">Approved</span>
</div>
</div>
</section>
</main>
<!-- Floating Action Button (Contextual for Home) -->
<button class="fixed bottom-[88px] right-margin-mobile w-14 h-14 bg-primary-container rounded-[20px] flex items-center justify-center text-white shadow-[0px_8px_20px_rgba(15,94,76,0.4)] z-50 hover:scale-95 transition-transform duration-150 md:hidden">
<span class="material-symbols-outlined text-[28px]">receipt_long</span>
</button>
<!-- BottomNavBar -->
<nav class="fixed bottom-0 w-full z-50 bg-[#1A1E29]/90 backdrop-blur-xl border-t border-outline-dark shadow-[0px_-4px_24px_rgba(0,0,0,0.5)] md:hidden pb-safe-area-bottom">
<div class="flex justify-around items-center px-margin-mobile pt-3 pb-2 w-full">
<!-- Home (Active) -->
<button class="flex flex-col items-center justify-center text-teal-accent font-semibold hover:opacity-80 transition-opacity active:scale-95 duration-150">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">home</span>
<span class="font-label-md text-[11px] mt-1">Home</span>
</button>
<!-- Submit -->
<button class="flex flex-col items-center justify-center text-gray-400 hover:opacity-80 transition-opacity active:scale-95 duration-150">
<span class="material-symbols-outlined">add_circle</span>
<span class="font-label-md text-[11px] mt-1">Submit</span>
</button>
<!-- Cards -->
<button class="flex flex-col items-center justify-center text-gray-400 hover:opacity-80 transition-opacity active:scale-95 duration-150">
<span class="material-symbols-outlined">credit_card</span>
<span class="font-label-md text-[11px] mt-1">Cards</span>
</button>
<!-- Approvals -->
<button class="flex flex-col items-center justify-center text-gray-400 hover:opacity-80 transition-opacity active:scale-95 duration-150">
<span class="material-symbols-outlined">rule</span>
<span class="font-label-md text-[11px] mt-1">Approvals</span>
</button>
<!-- Profile -->
<button class="flex flex-col items-center justify-center text-gray-400 hover:opacity-80 transition-opacity active:scale-95 duration-150">
<span class="material-symbols-outlined">person</span>
<span class="font-label-md text-[11px] mt-1">Profile</span>
</button>
</div>
</nav>
</body></html>
