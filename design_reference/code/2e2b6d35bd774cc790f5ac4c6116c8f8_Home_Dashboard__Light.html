<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>ExpenseGuard Home Dashboard</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "background": "#fff8f1",
                        "tertiary-fixed-dim": "#71dba2",
                        "surface-container-low": "#f9f3ec",
                        "tertiary": "#00462a",
                        "secondary-fixed": "#ffe08e",
                        "on-secondary-container": "#735a00",
                        "on-tertiary-fixed-variant": "#005232",
                        "on-secondary-fixed": "#241a00",
                        "surface-container-highest": "#e7e2db",
                        "inverse-on-surface": "#f6f0e9",
                        "on-tertiary-fixed": "#002112",
                        "surface-bright": "#fff8f1",
                        "on-surface": "#1d1b17",
                        "error": "#ba1a1a",
                        "secondary-container": "#fed255",
                        "inverse-surface": "#32302c",
                        "surface-tint": "#206a57",
                        "inverse-primary": "#8ed4bd",
                        "outline": "#6f7975",
                        "tertiary-container": "#00603c",
                        "secondary": "#755b00",
                        "on-tertiary": "#ffffff",
                        "surface-container": "#f3ede6",
                        "on-secondary": "#ffffff",
                        "secondary-fixed-dim": "#ecc246",
                        "on-primary-fixed": "#002018",
                        "tertiary-fixed": "#8df8bd",
                        "surface-variant": "#e7e2db",
                        "surface-container-lowest": "#ffffff",
                        "on-secondary-fixed-variant": "#584400",
                        "primary": "#004536",
                        "surface-container-high": "#ede7e0",
                        "on-primary-fixed-variant": "#005140",
                        "on-primary-container": "#8fd5be",
                        "primary-container": "#0f5e4c",
                        "primary-fixed-dim": "#8ed4bd",
                        "on-error": "#ffffff",
                        "on-primary": "#ffffff",
                        "outline-variant": "#bfc9c3",
                        "primary-fixed": "#aaf1d9",
                        "error-container": "#ffdad6",
                        "on-error-container": "#93000a",
                        "on-background": "#1d1b17",
                        "surface-dim": "#dfd9d2",
                        "on-surface-variant": "#3f4945",
                        "on-tertiary-container": "#72dca3",
                        "surface": "#fff8f1"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "stack-gap": "16px",
                        "safe-area-bottom": "34px",
                        "gutter-mobile": "12px",
                        "margin-mobile": "20px"
                    },
                    "fontFamily": {
                        "body-lg": ["Inter"],
                        "body-md": ["Inter"],
                        "headline-md": ["Inter"],
                        "display-currency": ["Inter"],
                        "label-md": ["Inter"],
                        "metadata": ["Inter"],
                        "headline-lg": ["Inter"]
                    },
                    "fontSize": {
                        "body-lg": ["17px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "body-md": ["15px", { "lineHeight": "22px", "fontWeight": "400" }],
                        "headline-md": ["20px", { "lineHeight": "26px", "fontWeight": "600" }],
                        "display-currency": ["40px", { "lineHeight": "48px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "label-md": ["13px", { "lineHeight": "18px", "letterSpacing": "0.01em", "fontWeight": "600" }],
                        "metadata": ["12px", { "lineHeight": "16px", "fontWeight": "400" }],
                        "headline-lg": ["28px", { "lineHeight": "34px", "letterSpacing": "-0.01em", "fontWeight": "600" }]
                    }
                }
            }
        }
    </script>
<style>
        .tabular-nums { font-variant-numeric: tabular-nums; }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-background min-h-screen pb-safe-area-bottom font-body-md">
<!-- TopAppBar -->
<header class="sticky top-0 w-full z-40 bg-background flex justify-between items-center px-margin-mobile py-4 transition-colors">
<div class="flex items-center gap-3">
<img class="w-10 h-10 rounded-full object-cover shadow-[0px_4px_12px_rgba(31,29,25,0.05)]" data-alt="A small, professional headshot of a woman named Sarah, smiling warmly in a well-lit office setting. The image should feel modern, corporate yet approachable, matching a light-mode enterprise app aesthetic. Soft, natural lighting." src="https://lh3.googleusercontent.com/aida-public/AB6AXuCSUu28ZS_MB4HjuCMQAASNka3nER3quAkNHx2kr8ykFeCChGcOgSvdZkaKBxKoj8Wd9N-T2fwSif04WqpdEd5tzrjqj4YqsdBx2-06BlOFI7hYfK2SLHv_men_-hyOhEQcUtz_91YRkN5RdITUXSsv-Z2FnfWJKKDm9gVASW7ONeZ49GyqmxengyuSxP8QJTR3sMA4NF8BiUoihdN-oLZetXeBadJ13d1Be1Pj3i9buEQjvYrpHdw4"/>
<span class="font-headline-md text-headline-md font-bold text-primary">ExpenseGuard</span>
</div>
<button class="w-10 h-10 flex items-center justify-center text-on-surface-variant hover:bg-surface-container-low rounded-full transition-colors active:scale-[0.98]">
<span class="material-symbols-outlined" data-icon="notifications">notifications</span>
</button>
</header>
<main class="px-margin-mobile pb-[100px] max-w-lg mx-auto">
<!-- Greeting -->
<section class="mt-4 mb-stack-gap">
<h1 class="font-headline-lg text-headline-lg text-on-background">Good morning, Sarah</h1>
</section>
<!-- Main Card -->
<section class="bg-surface-container-lowest rounded-[16px] p-5 shadow-[0px_4px_12px_rgba(31,29,25,0.05)] mb-stack-gap flex flex-col gap-2">
<p class="font-body-md text-body-md text-on-surface-variant">This month's spend</p>
<h2 class="font-display-currency text-display-currency text-on-surface tabular-nums">$2,450.80</h2>
</section>
<!-- Recent Transactions -->
<section>
<h3 class="font-headline-md text-headline-md text-on-background mb-4">Recent transactions</h3>
<div class="flex flex-col gap-stack-gap">
<!-- Transaction 1 -->
<div class="bg-surface-container-lowest rounded-[16px] p-4 shadow-[0px_4px_12px_rgba(31,29,25,0.05)] flex items-center justify-between hover:bg-surface-container-lowest/90 transition-colors active:scale-[0.98]">
<div class="flex items-center gap-4">
<div class="w-12 h-12 bg-surface-container rounded-full flex items-center justify-center text-primary-container">
<span class="material-symbols-outlined" data-icon="local_cafe">local_cafe</span>
</div>
<div>
<p class="font-body-lg text-body-lg font-semibold text-on-surface">Starbucks</p>
<p class="font-metadata text-metadata text-on-surface-variant">Today</p>
</div>
</div>
<div class="flex flex-col items-end gap-1">
<span class="font-body-lg text-body-lg font-semibold tabular-nums text-on-surface">$5.40</span>
<div class="bg-tertiary-fixed-dim/20 px-2 py-0.5 rounded-full flex items-center gap-1">
<span class="material-symbols-outlined text-[12px] text-tertiary" data-icon="check_circle">check_circle</span>
<span class="font-metadata text-metadata text-tertiary">Auto-cleared</span>
</div>
</div>
</div>
<!-- Transaction 2 -->
<div class="bg-surface-container-lowest rounded-[16px] p-4 shadow-[0px_4px_12px_rgba(31,29,25,0.05)] flex items-center justify-between hover:bg-surface-container-lowest/90 transition-colors active:scale-[0.98]">
<div class="flex items-center gap-4">
<div class="w-12 h-12 bg-surface-container rounded-full flex items-center justify-center text-primary-container">
<span class="material-symbols-outlined" data-icon="flight">flight</span>
</div>
<div>
<p class="font-body-lg text-body-lg font-semibold text-on-surface">Delta Air Lines</p>
<p class="font-metadata text-metadata text-on-surface-variant">Yesterday</p>
</div>
</div>
<div class="flex flex-col items-end gap-1">
<span class="font-body-lg text-body-lg font-semibold tabular-nums text-on-surface">$450.00</span>
<div class="bg-secondary-container/20 px-2 py-0.5 rounded-full flex items-center gap-1">
<span class="material-symbols-outlined text-[12px] text-secondary" data-icon="schedule">schedule</span>
<span class="font-metadata text-metadata text-secondary">Reviewing</span>
</div>
</div>
</div>
<!-- Transaction 3 -->
<div class="bg-surface-container-lowest rounded-[16px] p-4 shadow-[0px_4px_12px_rgba(31,29,25,0.05)] flex items-center justify-between hover:bg-surface-container-lowest/90 transition-colors active:scale-[0.98]">
<div class="flex items-center gap-4">
<div class="w-12 h-12 bg-surface-container rounded-full flex items-center justify-center text-primary-container">
<span class="material-symbols-outlined" data-icon="cloud">cloud</span>
</div>
<div>
<p class="font-body-lg text-body-lg font-semibold text-on-surface">AWS</p>
<p class="font-metadata text-metadata text-on-surface-variant">Oct 24</p>
</div>
</div>
<div class="flex flex-col items-end gap-1">
<span class="font-body-lg text-body-lg font-semibold tabular-nums text-on-surface">$124.50</span>
<div class="bg-tertiary-fixed-dim/20 px-2 py-0.5 rounded-full flex items-center gap-1">
<span class="material-symbols-outlined text-[12px] text-tertiary" data-icon="check_circle">check_circle</span>
<span class="font-metadata text-metadata text-tertiary">Auto-cleared</span>
</div>
</div>
</div>
</div>
</section>
</main>
<!-- FAB -->
<button class="fixed bottom-[90px] right-margin-mobile w-14 h-14 bg-primary-container text-on-primary rounded-full shadow-[0px_4px_12px_rgba(31,29,25,0.15)] flex items-center justify-center hover:opacity-90 active:scale-[0.95] transition-all z-40 md:hidden">
<span class="material-symbols-outlined text-3xl" data-icon="add">add</span>
</button>
<!-- BottomNavBar -->
<nav class="fixed bottom-0 w-full z-50 bg-surface/80 backdrop-blur-xl border-t border-outline-variant/30 shadow-[0px_-4px_12px_rgba(31,29,25,0.05)] flex justify-around items-center px-margin-mobile pt-3 pb-safe-area-bottom md:hidden">
<button class="flex flex-col items-center justify-center text-primary font-semibold hover:opacity-80 transition-opacity active:scale-95 duration-150">
<span class="material-symbols-outlined" data-icon="home" style="font-variation-settings: 'FILL' 1;">home</span>
<span class="font-label-md text-label-md mt-1">Home</span>
</button>
<button class="flex flex-col items-center justify-center text-on-surface-variant/70 hover:opacity-80 transition-opacity active:scale-95 duration-150">
<span class="material-symbols-outlined" data-icon="add_circle">add_circle</span>
<span class="font-label-md text-label-md mt-1">Submit</span>
</button>
<button class="flex flex-col items-center justify-center text-on-surface-variant/70 hover:opacity-80 transition-opacity active:scale-95 duration-150">
<span class="material-symbols-outlined" data-icon="credit_card">credit_card</span>
<span class="font-label-md text-label-md mt-1">Cards</span>
</button>
<button class="flex flex-col items-center justify-center text-on-surface-variant/70 hover:opacity-80 transition-opacity active:scale-95 duration-150">
<span class="material-symbols-outlined" data-icon="rule">rule</span>
<span class="font-label-md text-label-md mt-1">Approvals</span>
</button>
<button class="flex flex-col items-center justify-center text-on-surface-variant/70 hover:opacity-80 transition-opacity active:scale-95 duration-150">
<span class="material-symbols-outlined" data-icon="person">person</span>
<span class="font-label-md text-label-md mt-1">Profile</span>
</button>
</nav>
</body></html>
