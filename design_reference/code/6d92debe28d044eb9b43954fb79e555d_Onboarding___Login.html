<div class="w-16 h-16 bg-surface shadow-natural rounded-2xl flex items-center justify-center mb-6">
<span class="material-symbols-outlined text-4xl text-primary-container fill" style="font-variation-settings: 'FILL' 1;">

                </span>
</div>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile md:font-headline-lg md:text-headline-lg text-on-background text-center">
                Welcome back
            </h1>
<p class="font-body-md text-body-md text-on-surface-variant mt-2 text-center">
                ExpenseGuard Enterprise
            </p>
</div>
<!-- Action Area -->
<div class="w-full flex flex-col items-center space-y-6">
<!-- SSO Button -->
<button class="w-full bg-primary-container text-on-primary font-headline-md text-headline-md py-4 rounded-full flex items-center justify-center space-x-3 shadow-natural transition-transform duration-150 active:scale-95 hover:bg-primary-container/90">

<span>Continue with SSO</span>
</button>
<!-- Biometric Prompt -->
<button class="flex flex-col items-center text-on-surface-variant hover:text-primary-container transition-colors p-4 rounded-xl">
<span class="material-symbols-outlined text-3xl mb-1 opacity-80">
                    face
                </span>
<span class="font-label-md text-label-md opacity-80">
                    Use Face ID
                </span>
</button>
</div>
</main>

<footer class="mt-auto md:mt-8 pb-safe-area-bottom w-full text-center">
<a class="font-metadata text-metadata text-on-surface-variant/70 hover:text-on-surface-variant transition-colors underline-offset-2 hover:underline" href="#">
            Privacy Policy
        </a>
</footer>
<style>
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);

            to {

                transform: translateY(0);
            }

            animation: fadeInUp 0.6s ease-out forwards;
