<style>
        .camera-overlay {
            background: radial-gradient(circle at center, transparent 30%, rgba(31, 29, 25, 0.4) 100%);
        }
        
        .corner-marker {
            width: 32px;
            height: 32px;
            border-color: #0f5e4c; /* primary-container */
            border-style: solid;
            position: absolute;
            opacity: 0.8;
            transition: all 0.3s ease;
        }

        .scanning-pulse .corner-marker {
            animation: pulse-corners 2s infinite ease-in-out;
        }

        @keyframes pulse-corners {
            0% { transform: scale(1); opacity: 0.6; }
            50% { transform: scale(1.05); opacity: 1; border-color: #8ed4bd; } /* primary-fixed-dim */
            100% { transform: scale(1); opacity: 0.6; }
        }

        .scan-line {
            position: absolute;
            width: 100%;
            height: 2px;
            background: linear-gradient(90deg, transparent, rgba(142, 212, 189, 0.8), transparent);
            box-shadow: 0 0 10px rgba(142, 212, 189, 0.5);
            animation: scan-vertical 3s infinite linear;
            opacity: 0;
        }

        .scanning-active .scan-line {
            opacity: 1;
        }

        @keyframes scan-vertical {
            0% { top: 10%; }
            100% { top: 90%; }
        }

        /* Hide Top/Bottom Navs on this specific screen to prioritize camera canvas */
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
